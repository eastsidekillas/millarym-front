# За Caddy (HTTPS) берём схему из его заголовка, иначе — свою
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream app_upstream {
    server app:8000;
}

server {
    listen 80;
    root /app/frontend;
    index index.html;

    client_max_body_size 20M;

    location ^~ /admin {
        proxy_pass http://app_upstream;
        include proxy_params;
    }

    location ^~ /api {
        proxy_pass http://app_upstream;
        include proxy_params;
    }

    location ^~ /static/ {
        alias /app/static/;
    }

    location ^~ /media/ {
        alias /app/media/;
    }

    # Файлы сборки Angular с хешем в имени — кешируем надолго
    location ~* \.(?:js|css|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location / {
        # index.html не кешируем — после обновления сразу открывается новая версия
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
