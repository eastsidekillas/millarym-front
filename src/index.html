<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Резервы и Заказы</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="milarum-logo.svg">
  <!-- тема до загрузки приложения, чтобы страница не мигала светлой (см. ThemeService) -->
  <script>
    try {
      var theme = localStorage.getItem('theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.classList.add(theme);
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
