<div class="flex min-h-full flex-col">
  <header class="sticky top-0 z-30 border-b border-line bg-surface">
    <div class="flex flex-wrap items-center gap-3 px-4 py-3 md:px-6">
      <a routerLink="/" class="mr-2 flex items-center gap-3">
        <span class="flex-none rounded-xl bg-white p-1">
          <img src="milarum-logo.svg" alt="Миларум" class="h-9 w-auto" />
        </span>
        <span class="leading-tight">
          <span class="block font-bold tracking-tight">CRM фабрики</span>
          <span class="block text-xs text-muted">Производство и склады</span>
        </span>
      </a>

      <nav class="order-3 flex w-full gap-1 overflow-x-auto md:order-none md:w-auto">
        @for (item of nav; track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-accent/10 font-semibold text-accent"
            class="whitespace-nowrap rounded-lg px-3 py-2 text-sm hover:bg-sub"
          >
            {{ item.title }}
          </a>
        }
      </nav>

      <div class="order-2 min-w-[200px] flex-1 md:order-none"></div>

      @if (auth.me(); as me) {
        <div class="order-2 flex items-center gap-3 md:order-none">
          <div class="text-right text-xs leading-tight">
            <div class="text-sm font-medium">{{ me.short_name }}</div>
            <div class="text-muted">{{ me.role }}</div>
          </div>
          <button type="button" class="btn-ghost" (click)="auth.logout()">Выйти</button>
        </div>
      }
    </div>
  </header>

  <main class="min-w-0 flex-1 px-4 pb-12 pt-4 md:px-6">
    <router-outlet />
  </main>
</div>
