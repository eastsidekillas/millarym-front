<div class="flex min-h-full items-center justify-center px-4 py-10">
  <div class="w-full max-w-sm">
    <div class="mb-6 flex flex-col items-center gap-3 text-center">
      <span class="rounded-2xl bg-white p-2 shadow-sm">
        <img src="milarum-logo.svg" alt="Миларум" class="h-16 w-auto" />
      </span>
      <div>
        <div class="text-lg font-bold tracking-tight">CRM фабрики</div>
        <div class="text-sm text-muted">Производство и склады</div>
      </div>
    </div>

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="space-y-4 rounded-2xl border border-line bg-surface p-6 shadow-sm"
      novalidate
    >
      <label class="block">
        <span class="mb-1 block text-sm font-medium">Логин или почта</span>
        <input
          formControlName="login"
          class="field"
          type="text"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          autofocus
        />
      </label>

      <label class="block">
        <span class="mb-1 block text-sm font-medium">Пароль</span>
        <div class="relative">
          <input
            formControlName="password"
            class="field pr-20"
            [type]="showPassword() ? 'text' : 'password'"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="absolute inset-y-0 right-2 my-auto h-7 rounded-md px-2 text-xs text-muted hover:bg-sub"
            (click)="showPassword.set(!showPassword())"
          >
            {{ showPassword() ? 'Скрыть' : 'Показать' }}
          </button>
        </div>
      </label>

      @if (error()) {
        <p class="rounded-lg bg-crit/10 px-3 py-2 text-sm text-crit" role="alert">{{ error() }}</p>
      }

      <button type="submit" class="btn-primary w-full" [disabled]="loading()">
        {{ loading() ? 'Входим…' : 'Войти' }}
      </button>
    </form>

    <p class="mt-4 text-center text-xs text-muted">
      Забыли пароль — обратитесь к директору или администратору.
    </p>
  </div>
</div>
